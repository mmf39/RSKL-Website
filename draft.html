<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSKL Draft</title>
    <link rel="icon" type="image/png" href="/assets/rskl-logo.png?v=4" />
    <link rel="shortcut icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="apple-touch-icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <h1>Draft</h1>
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="nav-links">
            <a class="btn ghost" href="/">Dashboard</a>
            <a class="btn ghost" href="/schedule.html">Schedule</a>
            <a class="btn ghost" href="/draft.html">Draft</a>
            <a class="btn ghost" href="/transactions.html">Transactions</a>
            <a class="btn ghost" href="/player.html">Player Stats</a>
            <a class="btn ghost" href="/standings.html">Standings</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="panel-head">
          <h2>Draft Board</h2>
          <div class="controls">
            <label for="draft-year-select" class="label">Draft Year</label>
            <select id="draft-year-select">
              <option value="c2s2">C2S2</option>
              <option value="c2s1">C2S1</option>
            </select>
            <label for="round-select" class="label">Round</label>
            <select id="round-select">
              <option value="all">All Rounds</option>
              <option value="round-1">Round 1</option>
              <option value="round-2">Round 2</option>
              <option value="round-3">Round 3</option>
              <option value="round-4">Round 4</option>
            </select>
          </div>
        </div>
        <div id="draft-sections" class="draft-rounds"></div>
      </section>
    </main>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets • <a class="footer-link" href="/gm.html">GM Admin</a>
    </footer>

    <script src="draft.js"></script>
  </body>
</html>
