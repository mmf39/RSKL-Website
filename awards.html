<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Award Winners</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <h1>Award Winners</h1>
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="nav-links">
            <a class="btn ghost" href="/">Dashboard</a>
            <a class="btn ghost" href="/schedule.html">Schedule</a>
            <a class="btn ghost" href="/player.html">Player Stats</a>
            <a class="btn ghost" href="/standings.html">Standings</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="panel-head">
          <h2>Season Awards</h2>
          <div class="controls">
            <label for="awards-season" class="label">Season</label>
            <select id="awards-season">
              <option value="c2s1">C2S1</option>
              <option value="c1s6">C1S6</option>
              <option value="c1s5">C1S5</option>
              <option value="c1s4">C1S4</option>
              <option value="c1s3">C1S3</option>
              <option value="c1s2">C1S2</option>
              <option value="c1s1">C1S1</option>
            </select>
          </div>
        </div>
        <div id="awards-table"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Season Champions</h2>
        </div>
        <div id="champions-table"></div>
      </section>
    </main>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets
    </footer>

    <script src="awards.js"></script>
