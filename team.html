<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSKL Team Roster</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="team-page">
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <img id="team-logo" class="team-hero-logo" alt="" />
        <h1 id="team-title">Team Roster</h1>
        
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="nav-links">
            <a class="btn ghost" href="/">Dashboard</a>
            <a class="btn ghost" href="/schedule.html">Schedule</a>
            <a class="btn ghost" href="/player.html">Player Stats</a>
            <a class="btn ghost" href="/standings.html">Standings</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
            <select id="season-select" class="season-select">
              <option value="c2s2">C2S2 (Current)</option>
              <option value="c2s1-regular">C2S1 Regular Season</option>
              <option value="c2s1-post">C2S1 Postseason</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <main class="container roster-layout">
      <section class="panel compact-panel">
        <div class="panel-head">
          <h2>Roster</h2>
        </div>
        <div class="table-wrap">
          <table id="roster-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel compact-panel standings-mini">
        <div class="panel-head">
          <h2>Standings</h2>
        </div>
        <div class="mini-row"><span>Team</span><strong id="stat-team">—</strong></div>
        <div class="mini-row"><span>GP</span><strong id="stat-gp">—</strong></div>
        <div class="mini-row"><span>Wins</span><strong id="stat-wins">—</strong></div>
        <div class="mini-row"><span>Loss</span><strong id="stat-loss">—</strong></div>
        <div class="mini-row"><span>GB</span><strong id="stat-gb">—</strong></div>
        <div class="mini-row"><span>Win %</span><strong id="stat-winpct">—</strong></div>
        <div class="mini-row"><span>SOS</span><strong id="stat-sos">—</strong></div>
      </section>

      <section class="panel compact-panel">
        <div class="panel-head">
          <h2>Team Schedule</h2>
        </div>
        <div class="table-wrap">
          <table id="team-schedule">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets • <a class="footer-link" href="/gm.html">GM Admin</a>
    </footer>

    <div id="boxscore-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>Box Score</h2>
          <button class="modal-close" data-close="true">Close</button>
        </div>
        <div id="boxscore-details" class="boxscore-details"></div>
      </div>
    </div>

    <script src="team.js"></script>
  </body>
</html>
