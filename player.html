<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSKL Player Stats</title>
    <link rel="icon" type="image/png" href="/assets/rskl-logo.png?v=4" />
    <link rel="shortcut icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="apple-touch-icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="stylesheet" href="styles.css?v=20260504u" />
  </head>
  <body class="player-page">
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <h1>Player Stats</h1>
        
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="site-nav">
            <div class="site-nav-main">
              <a class="btn ghost" href="/">Dashboard</a>
              <a class="btn ghost" href="/schedule.html">Schedule</a>
              <a class="btn ghost" href="/standings.html">Standings</a>
              <a class="btn ghost" href="/player.html">Player Stats</a>
              <a class="btn ghost" href="/cap-expert.html">Cap Expert</a>
              <select id="season-select" class="season-select">
                <option value="c2s3-regular">C2S3 Regular Season (Current)</option>
                <option value="c2s2-regular">C2S2 Regular Season (Previous)</option>
                <option value="c2s1-regular">C2S1 Regular Season</option>
                <option value="c2s1-post">C2S1 Postseason</option>
              </select>
            </div>
            <button class="site-menu-btn" type="button" aria-expanded="false" aria-label="Open menu" data-menu-toggle><span class="site-menu-btn-label">More</span><span class="site-menu-btn-icon" aria-hidden="true">☰</span></button>
          </div>
          <div class="site-menu" hidden data-menu-panel>
            <a class="btn ghost" href="/transactions.html">Transactions</a>
            <a class="btn ghost" href="/draft.html">Draft</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
            <a class="btn ghost" href="/gm.html">GM Admin</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container player-shell">
      <section class="panel player-dashboard-panel">
        <div class="panel-head">
          <div class="player-panel-heading">
            <span class="player-panel-kicker">Leaderboard</span>
            <h2>Top 25 Players</h2>
          </div>
          <div class="controls player-controls">
            <div class="control-field">
              <label for="player-season-select" class="label">Season</label>
              <select id="player-season-select">
                <option value="c2s3-regular">C2S3 Regular Season</option>
                <option value="c2s2-regular">C2S2 Regular Season (Previous)</option>
                <option value="c2s1-playoffs">C2S1 Playoffs</option>
                <option value="c2s1-regular">C2S1 Regular Season</option>
              </select>
            </div>
            <div class="control-field">
              <label for="player-filter" class="label">Filter</label>
              <select id="player-filter">
                <option value="avg_score">Score Average</option>
                <option value="total_score">Total Score</option>
                <option value="avg_rank">Rank Average</option>
                <option value="rel_median">REL (Median)</option>
                <option value="rel_mean">REL (Mean)</option>
                <option value="war">WAR</option>
                <option value="gp">GP</option>
              </select>
            </div>
            <div class="control-field">
              <label for="player-search" class="label">Player</label>
              <input id="player-search" type="text" placeholder="Type a player name" />
            </div>
            <div class="control-field">
              <label for="player-min-gp" class="label">Min GP</label>
              <input id="player-min-gp" type="number" min="0" step="1" value="0" placeholder="0" />
            </div>
          </div>
        </div>
        <div class="player-results-shell">
          <div id="player-results" class="player-results"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets • <a class="footer-link" href="/gm.html">GM Admin</a>
    </footer>

    <script src="player.js?v=20260503a"></script>
      <script src="header-nav.js?v=20260504e"></script>
  </body>
</html>
