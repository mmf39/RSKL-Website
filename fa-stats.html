        <div class="meta">

          <div class="site-nav">
            <div class="site-nav-main">
              <a class="btn ghost" href="/">Dashboard</a>
              <a class="btn ghost" href="/schedule.html">Schedule</a>
              <a class="btn ghost" href="/standings.html">Standings</a>
              <a class="btn ghost" href="/player.html">Player Stats</a>
              <a class="btn ghost" href="/cap-expert.html">Cap Expert</a>
              <select id="season-select" class="season-select">
                <option value="c2s3-regular">C2S3 Regular Season (Current)</option>
                <option value="c2s2-regular">C2S2 Regular Season (Previous)</option>
                <option value="c2s1-regular">C2S1 Regular Season</option>
                <option value="c2s1-post">C2S1 Postseason</option>
              </select>
            </div>
            <button class="site-menu-btn" type="button" aria-expanded="false" aria-label="Open menu" data-menu-toggle><span class="site-menu-btn-label">More</span><span class="site-menu-btn-icon" aria-hidden="true">☰</span></button>
          </div>
          <div class="site-menu" hidden data-menu-panel>
            <a class="btn ghost" href="/transactions.html">Transactions</a>
            <a class="btn ghost" href="/draft.html">Draft</a>

            <a class="btn ghost" href="/gm.html">GM Admin</a>

        </div>

    <main class="container">
      <section class="panel">
        <div class="panel-head">
          <h2>Free Agent Player Cards</h2>
          <div class="controls fa-controls">
            <label for="fa-field" class="label">Search By</label>
            <select id="fa-field">
              <option value="player">Player</option>
              <option value="dailyKarma">Daily Karma</option>
              <option value="dailyRank">Daily Rank</option>
              <option value="weeklyKarma">Weekly Karma</option>
              <option value="weeklyRank">Weekly Rank</option>
              <option value="monthlyKarma">Monthly Karma</option>
              <option value="monthlyRank">Monthly Rank</option>
              <option value="totalKarma">Total Karma</option>
              <option value="totalKarmaRank">Total Karma Rank</option>
              <option value="rankedDays">Ranked Days</option>
              <option value="avgRankOnRankedDays">Avg Rank (Ranked Days)</option>
            </select>
            <label for="fa-search" class="label">Search</label>
            <input id="fa-search" type="text" placeholder="Search value" />
          </div>
        </div>
        <div id="fa-stats-grid" class="fa-grid"></div>
      </section>
    </main>

    <footer class="footer">
