<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GM Admin</title>
    <link rel="icon" type="image/png" href="/assets/rskl-logo.png?v=4" />
    <link rel="shortcut icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="apple-touch-icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <h1>GM Admin</h1>
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="nav-links">
            <a class="btn ghost" href="/">Dashboard</a>
            <a class="btn ghost" href="/schedule.html">Schedule</a>
            <a class="btn ghost" href="/draft.html">Draft</a>
            <a class="btn ghost" href="/transactions.html">Transactions</a>
            <a class="btn ghost" href="/player.html">Player Stats</a>
            <a class="btn ghost" href="/standings.html">Standings</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel" id="gm-panel">
        <div class="panel-head">
          <h2>Trade Block</h2>
        </div>
        <div class="gm-card">
          <label class="label" for="gm-team-select">Team</label>
          <select id="gm-team-select" class="text-input">
            <option value="">Select your team</option>
            <option value="Gus N Em">Gus N Em</option>
            <option value="Bullets">Storm</option>
            <option value="Turkeys">Turkeys</option>
            <option value="Cheerios">Cheerios</option>
            <option value="Yetis">Yetis</option>
            <option value="Illegals">Illegals</option>
            <option value="The Lions">The Lions</option>
            <option value="The Future">The Future</option>
            <option value="The Snipers">The Snipers</option>
            <option value="The Phantoms">The Phantoms</option>
          </select>

          <div class="gm-row">
            <div>
              <div class="label">Selected Team</div>
              <div id="gm-team-label" class="gm-team-label">—</div>
            </div>
          </div>

          <label class="label">Players</label>
          <div id="trade-player-list" class="gm-checklist"></div>

          <label class="label">Draft Picks</label>
          <div id="trade-picks-list" class="gm-checklist"></div>

          <label class="label" for="trade-notes">Notes</label>
          <textarea id="trade-notes" class="text-input" rows="4" placeholder="Notes..."></textarea>

          <label class="label" for="trade-code">Access Code</label>
          <input id="trade-code" class="text-input" type="password" placeholder="Enter code to update" />

          <button id="trade-save" class="btn">Save Trade Block</button>
          <div id="trade-status" class="gm-status"></div>
        </div>

        <div class="gm-card">
          <div class="label">Player Name Changes</div>
          <label class="label" for="rename-team-select">Team</label>
          <select id="rename-team-select" class="text-input">
            <option value="">Select team</option>
            <option value="Gus N Em">Gus N Em</option>
            <option value="Bullets">Storm</option>
            <option value="Turkeys">Turkeys</option>
            <option value="Cheerios">Cheerios</option>
            <option value="Yetis">Yetis</option>
            <option value="Illegals">Illegals</option>
            <option value="The Lions">The Lions</option>
            <option value="The Future">The Future</option>
            <option value="The Snipers">The Snipers</option>
            <option value="The Phantoms">The Phantoms</option>
          </select>

          <label class="label" for="rename-player-select">Current Player</label>
          <select id="rename-player-select" class="text-input">
            <option value="">Select a player</option>
          </select>

          <label class="label" for="rename-new-name">New Player Name</label>
          <input id="rename-new-name" class="text-input" type="text" placeholder="@newname" />

          <label class="label" for="rename-code">Access Code</label>
          <input id="rename-code" class="text-input" type="password" placeholder="Enter code to update" />

          <button id="rename-save" class="btn">Update Player Name</button>
          <div id="rename-status" class="gm-status"></div>
        </div>

        <div class="gm-card">
          <div class="label">Other Teams (Read Only)</div>
          <div id="trade-view-list" class="gm-readonly-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets • <a class="footer-link" href="/gm.html">GM Admin</a>
    </footer>

    <script src="gm.js"></script>
  </body>
</html>
