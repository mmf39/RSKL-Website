<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GM Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <h1>GM Admin</h1>
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="nav-links">
            <a class="btn ghost" href="/">Dashboard</a>
            <a class="btn ghost" href="/schedule.html">Schedule</a>
            <a class="btn ghost" href="/player.html">Player Stats</a>
            <a class="btn ghost" href="/standings.html">Standings</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="panel-head">
          <h2>GM Login</h2>
        </div>
        <div class="gm-grid">
          <div class="gm-card">
            <label class="label" for="gm-email">Email</label>
            <input id="gm-email" class="text-input" type="email" placeholder="gm@example.com" />
            <label class="label" for="gm-password">Password</label>
            <input id="gm-password" class="text-input" type="password" placeholder="Password" />
            <label class="label" for="gm-team">Team (Sign Up)</label>
            <select id="gm-team" class="text-input">
              <option value="">Select your team</option>
              <option value="Gus N Em">Gus N Em</option>
              <option value="Bullets">Bullets</option>
              <option value="Turkeys">Turkeys</option>
              <option value="Cheerios">Cheerios</option>
              <option value="Yetis">Yetis</option>
              <option value="Illegals">Illegals</option>
              <option value="The Lions">The Lions</option>
              <option value="The Future">The Future</option>
              <option value="The Snipers">The Snipers</option>
              <option value="The Phantoms">The Phantoms</option>
            </select>
            <div class="gm-actions">
              <button id="gm-login" class="btn">Sign In</button>
              <button id="gm-signup" class="btn ghost">Sign Up</button>
              <button id="gm-logout" class="btn ghost" hidden>Sign Out</button>
            </div>
            <div id="gm-status" class="gm-status"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="gm-panel" hidden>
        <div class="panel-head">
          <h2>GM Tools</h2>
          <div class="gm-tabs">
            <button class="gm-tab active" data-tab="players">Change Players</button>
            <button class="gm-tab" data-tab="trade">Trade Block</button>
          </div>
        </div>

        <div class="gm-tab-panel" data-panel="players">
          <div class="gm-card">
            <label class="label" for="team-select">Team</label>
            <select id="team-select" class="text-input">
              <option value="">Select a team</option>
              <option value="Gus N Em">Gus N Em</option>
              <option value="Bullets">Bullets</option>
              <option value="Turkeys">Turkeys</option>
              <option value="Cheerios">Cheerios</option>
              <option value="Yetis">Yetis</option>
              <option value="Illegals">Illegals</option>
              <option value="The Lions">The Lions</option>
              <option value="The Future">The Future</option>
              <option value="The Snipers">The Snipers</option>
              <option value="The Phantoms">The Phantoms</option>
            </select>
            <div id="team-players" class="gm-list"></div>
            <label class="label" for="player-tag">Player Tag (current)</label>
            <input id="player-tag" class="text-input" type="text" placeholder="@player" />
            <div id="player-suggestions" class="gm-suggestions"></div>
            <label class="label" for="display-name">New Display Name</label>
            <input id="display-name" class="text-input" type="text" placeholder="New name" />
            <button id="update-player" class="btn">Update Player</button>
            <div id="gm-result" class="gm-status"></div>
          </div>
        </div>

        <div class="gm-tab-panel" data-panel="trade" hidden>
          <div class="gm-card">
            <div class="gm-row">
              <div>
                <div class="label">Your Team</div>
                <div id="gm-team-label" class="gm-team-label">—</div>
              </div>
              <div>
                <label class="label" for="trade-view">View Team</label>
                <select id="trade-view" class="text-input">
                  <option value="">Select a team</option>
                  <option value="Gus N Em">Gus N Em</option>
                  <option value="Bullets">Bullets</option>
                  <option value="Turkeys">Turkeys</option>
                  <option value="Cheerios">Cheerios</option>
                  <option value="Yetis">Yetis</option>
                  <option value="Illegals">Illegals</option>
                  <option value="The Lions">The Lions</option>
                  <option value="The Future">The Future</option>
                  <option value="The Snipers">The Snipers</option>
                  <option value="The Phantoms">The Phantoms</option>
                </select>
              </div>
            </div>

            <label class="label">Players</label>
            <div id="trade-player-list" class="gm-checklist"></div>

            <label class="label" for="trade-picks">Draft Picks (one per line)</label>
            <textarea id="trade-picks" class="text-input" rows="4" placeholder="2026 1st\n2027 2nd"></textarea>

            <label class="label" for="trade-notes">Notes</label>
            <textarea id="trade-notes" class="text-input" rows="4" placeholder="Notes..."></textarea>

            <button id="trade-save" class="btn">Save Trade Block</button>
            <div id="trade-status" class="gm-status"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets
    </footer>

    <script src="gm.js" type="module"></script>
  </body>
</html>
