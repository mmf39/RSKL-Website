<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSKL Schedule</title>
    <link rel="icon" type="image/png" href="/assets/rskl-logo.png?v=4" />
    <link rel="shortcut icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="apple-touch-icon" href="/assets/rskl-logo.png?v=4" />
    <link rel="stylesheet" href="styles.css?v=20260504e" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">Real Sports Karma League</div>
        <h1>Schedule</h1>
        
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="site-nav">
            <div class="site-nav-main">
              <a class="btn ghost" href="/">Dashboard</a>
              <a class="btn ghost" href="/schedule.html">Schedule</a>
              <a class="btn ghost" href="/standings.html">Standings</a>
              <a class="btn ghost" href="/player.html">Player Stats</a>
              <select id="season-select" class="season-select">
                <option value="c2s3-regular">C2S3 Regular Season (Current)</option>
                <option value="c2s2-regular">C2S2 Regular Season (Previous)</option>
                <option value="c2s1-regular">C2S1 Regular Season</option>
                <option value="c2s1-post">C2S1 Postseason</option>
              </select>
            </div>
            <button class="site-menu-btn" type="button" aria-expanded="false" aria-label="Open menu" data-menu-toggle>☰</button>
          </div>
          <div class="site-menu" hidden data-menu-panel>
            <a class="btn ghost" href="/transactions.html">Transactions</a>
            <a class="btn ghost" href="/draft.html">Draft</a>
            <a class="btn ghost" href="/awards.html">Awards</a>
            <a class="btn ghost" href="/gm.html">GM Admin</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel schedule-panel">
        <div class="panel-head">
          <h2>Schedule</h2>
          <div class="controls">
            <label for="schedule-day" class="label">Day</label>
            <select id="schedule-day"></select>
            <label for="schedule-search" class="label">Search</label>
            <input id="schedule-search" type="text" placeholder="Search games" />
          </div>
        </div>
        <section class="schedule-group">
          <div class="schedule-group-head">
            <h3 id="upcoming-games-title">Upcoming Game Day</h3>
          </div>
          <div id="next-games" class="calendar-games"></div>
        </section>
        <section class="schedule-group">
          <div class="schedule-group-head">
            <h3 id="day-games-title">Games By Day</h3>
          </div>
          <div id="day-games" class="calendar-games"></div>
        </section>
      </section>
    </main>

    <div id="boxscore-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>Box Score</h2>
          <button class="modal-close" data-close="true">Close</button>
        </div>
        <div id="boxscore-details" class="boxscore-details"></div>
      </div>
    </div>
    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets • <a class="footer-link" href="/gm.html">GM Admin</a>
    </footer>

      <script src="schedule.js?v=20260504c"></script>
      <script src="header-nav.js?v=20260504a"></script>
  </body>
</html>
