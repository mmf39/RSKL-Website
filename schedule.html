<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSKL Schedule</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="hero">
      <div class="hero-inner">
        <div class="badge">RSKL Fantasy League</div>
        <h1>Schedule</h1>
        
        <div class="meta">
          <span id="last-updated">Last updated: —</span>
          <div class="nav-links">
            <a class="btn ghost" href="/">Dashboard</a>
            <a class="btn ghost" href="/schedule.html">Schedule</a>
            <a class="btn ghost" href="/player.html">Player Stats</a>
            <a class="btn ghost" href="/standings.html">Standings</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel schedule-panel">
        <div class="panel-head">
          <h2>Schedule</h2>
          <div class="controls">
            <label for="schedule-search" class="label">Search</label>
            <input id="schedule-search" type="text" placeholder="Search games" />
          </div>
        </div>
        <div class="table-wrap">
          <table id="schedule-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="boxscore-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>Box Score</h2>
          <button class="modal-close" data-close="true">Close</button>
        </div>
        <div id="boxscore-details" class="boxscore-details"></div>
      </div>
    </div>

    <footer class="footer">
      Built for the RSKL league • Powered by Google Sheets
    </footer>

    <script src="schedule.js"></script>
  </body>
</html>
